<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 50" width="300" height="50">
  <defs>
    <!-- Amblem Arka Plan Gradyanı -->
    <linearGradient id="emblemBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d" />
      <stop offset="100%" stop-color="#0f1117" />
    </linearGradient>
    
    <!-- Kask Kırmızı Gradyanı (Canlı ve Derinlikli) -->
    <linearGradient id="helmetRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#d30a0a" />
    </linearGradient>
  </defs>

  <!-- ==================== AMBLEM (SOL İKON) ==================== -->
  <g transform="translate(3, 3)">
    <!-- Rozet Arka Planı (Hafif yuvarlatılmış köşeler & ince zarif kontur) -->
    <rect x="0" y="0" width="52" height="44" rx="6" ry="6" fill="url(#emblemBgDark)" stroke="#3b4252" stroke-width="1.2" />
    
    <!-- Üst Kırmızı Kask Kubbesi -->
    <path d="M 12 16.5 C 12 8 18 3 26 3 C 34 3 40 8 40 16.5 Z" fill="url(#helmetRedGrad)" />
    
    <!-- Kask Siper Çizgisi -->
    <line x1="12" y1="16.5" x2="40" y2="16.5" stroke="#990000" stroke-width="1.2" />

    <!-- İtfaiyeci Profil / Gövde Ana Parçası (Beyaz) -->
    <path d="M 13 21 L 33 21 C 36 21 41.5 22 42.5 25 C 43.5 27 42.5 30 38.5 32 L 33 34 L 10 34 Z" fill="#FFFFFF" />
    
    <!-- Profil Göz / Vizör Boşluğu -->
    <circle cx="39.2" cy="23.8" r="1.3" fill="#181a20" />
    
    <!-- Orta Reflektif Şerit (Beyaz) -->
    <path d="M 9.5 36.5 L 33 36.5 L 32.5 38.5 L 8.5 38.5 Z" fill="#FFFFFF" />
    
    <!-- Alt Reflektif Şerit (Beyaz) -->
    <path d="M 8 40.5 L 32 40.5 L 31.5 42.5 L 7 42.5 Z" fill="#FFFFFF" />
  </g>

  <!-- ==================== LOGO TİPOGRAFİSİ ==================== -->
  <!-- 1. Satır: AYDINOĞULLARI (Koyu Zemin İçin Canlı Kırmızı) -->
  <text x="64" y="23.5" 
        fill="#FF2E36" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="20.5px" 
        letter-spacing="0.6px">AYDINOĞULLARI</text>

  <!-- 2. Satır: Yangın Söndürme San. ve Tic. Ltd. Şti. (Koyu Zemin İçin BEYAZ Alt Metin) -->
  <text x="65" y="41.5" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="600" 
        font-size="10.2px" 
        letter-spacing="0.25px">Yangın Söndürme San. ve Tic. Ltd. Şti.</text>
</svg>
